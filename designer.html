<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Конструктор и отладчик макетов Атласа</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Times New Roman',serif;background:#cbd5e1;color:#111;display:flex;height:100vh;overflow:hidden}
.side{width:355px;background:#fff;border-right:1px solid #94a3b8;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side h2{font-size:16px;border-bottom:2px solid #0f172a;padding-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.grp{border:1px solid #cbd5e1;border-radius:4px;padding:8px;background:#f8fafc;display:flex;flex-direction:column;gap:6px}
.grp-t{font-weight:bold;font-size:13px;color:#0f172a}
label{font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
input[type=range]{width:125px;cursor:pointer}
select,button{height:28px;font-family:inherit;font-size:12.5px;border:1px solid #64748b;border-radius:3px;padding:0 6px}
.btn-p{background:#0284c7;color:#fff;border:none;font-weight:bold;cursor:pointer}
.btn-g{background:#15803d;color:#fff;border:none;font-weight:bold;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;overflow:auto;gap:10px}
canvas{background:#fff;box-shadow:0 8px 28px rgba(0,0,0,0.28);max-width:100%;height:auto;border:1px solid #64748b}
textarea{width:100%;height:74px;font-family:monospace;font-size:11px;padding:4px;border:1px solid #94a3b8}
</style>
</head>
<body>
<div class="side">
  <h2><span>🛠 Отладчик макетов</span><span id="dStatus" style="font-size:11px;color:#15803d;">Готов</span></h2>
  <label><b>Макет листа:</b>
    <select id="dMode">
      <option value="passport">Цифровой паспорт МО (А4 книж.)</option>
      <option value="bench">Бенчмаркинг МО (А4 книж.)</option>
      <option value="table">Таблица динамики (А4 альб.)</option>
      <option value="map">Карта территории (А4 альб.)</option>
    </select>
  </label>
  <label><b>Образец МО:</b><select id="dSampleMO" style="max-width:210px;"><option value="">Загрузка МО...</option></select></label>
  <div class="grp">
    <div class="grp-t">1. Типографика и шрифты</div>
    <label>Заголовок листа: <span id="vH1">42</span>px <input type="range" id="rH1" min="28" max="72" value="42"></label>
    <label>Подзаголовок: <span id="vH2">30</span>px <input type="range" id="rH2" min="20" max="54" value="30"></label>
    <label>Основной текст / таблицы: <span id="vBody">20</span>px <input type="range" id="rBody" min="14" max="30" value="20"></label>
    <label>Подписи шкалы / легенды: <span id="vLeg">26</span>px <input type="range" id="rLeg" min="16" max="40" value="26"></label>
  </div>
  <div class="grp">
    <div class="grp-t">2. Геометрия и пропорции</div>
    <label>Ширина колонки названий: <span id="vColW">1360</span>px <input type="range" id="rColW" min="900" max="1650" value="1360"></label>
    <label>Радиус лепестковых диаграмм: <span id="vRad">155</span>px <input type="range" id="rRad" min="100" max="210" value="155"></label>
    <label>Прозрачность заливки: <span id="vAlpha">0.16</span> <input type="range" id="rAlpha" min="0.04" max="0.40" step="0.02" value="0.16"></label>
  </div>
  <div class="grp">
    <div class="grp-t">3. Состав и порядок блоков</div>
    <label><input type="checkbox" id="cMeta" checked> Блок общей характеристики</label>
    <label><input type="checkbox" id="cSubRad" checked> Диаграмма субиндексов</label>
    <label><input type="checkbox" id="cMidTbl" checked> Таблица субиндексов и подблоков</label>
    <label><input type="checkbox" id="cBlkRad" checked> Диаграмма подблоков</label>
    <label><input type="checkbox" id="c39" checked> Блок 39 частных показателей</label>
    <label><input type="checkbox" id="cInvScale" checked> Шкала дестимуляторов: зелёный справа</label>
  </div>
  <button type="button" class="btn-g" id="btnApplySite">✅ Сохранить настройки для Атласа</button>
  <button type="button" class="btn-p" id="btnDlTest">💾 Скачать тестовый PNG (300 dpi)</button>
  <div class="grp">
    <div class="grp-t">Конфигурация (JSON):</div>
    <textarea id="cfgOut" readonly></textarea>
  </div>
</div>
<div class="main">
  <canvas id="prevCv" width="938" height="1326"></canvas>
</div>
<script>
let REAL_DATA=null,REAL_MOS=Array.of();
const cv=document.getElementById("prevCv"),ctx=cv.getContext("2d");

async function loadRealAtlasData(){
  try{
    const [rM,rG]=await Promise.all([fetch("metrics_data.json"),fetch("geo_plotly.json")]);
    if(rM.ok)REAL_DATA=await rM.json();
    if(rG.ok){
      const geo=await rG.json(),seen=new Set();
      geo.features.forEach(ft=>{
        const p=ft.properties;if(p._map_status!=="В_выборке"||p._inset||seen.has(p.join_key))return;
        seen.add(p.join_key);REAL_MOS.push({key:p.join_key,lbl:p._lbl||p.name,reg:p.region||"",cat:p.cat||"5"});
      });
      REAL_MOS.sort((a,b)=>a.lbl.localeCompare(b.lbl,"ru"));
      document.getElementById("dSampleMO").innerHTML=REAL_MOS.slice(0,250).map(m=>'<option value="'+m.key+'">'+m.lbl+' ('+m.reg+')</option>').join("");
    }
    document.getElementById("dStatus").textContent="База: "+REAL_MOS.length+" МО";
  }catch(e){document.getElementById("dStatus").textContent="Демо-режим";}
  drawPreview();
}

function getVal(mPat,jk,defV){
  if(!REAL_DATA||!jk)return defV;
  const m=REAL_DATA.metrics.find(x=>x.id===mPat||x.title.includes(mPat));if(!m)return defV;
  const v=REAL_DATA.v2024?.[m.id]?.[jk];return(v!==null&&v!==undefined&&!isNaN(Number(v)))?Number(v):defV;
}

function drawPreview(){
  const mode=document.getElementById("dMode").value,jk=document.getElementById("dSampleMO").value;
  const mo=REAL_MOS.find(x=>x.key===jk)||{lbl:"Апатиты (МО)",reg:"Мурманская область",cat:"4"};
  const h1=+document.getElementById("rH1").value,h2=+document.getElementById("rH2").value,body=+document.getElementById("rBody").value,leg=+document.getElementById("rLeg").value;
  const colW=+document.getElementById("rColW").value,rad=+document.getElementById("rRad").value,alpha=+document.getElementById("rAlpha").value;
  document.getElementById("vH1").textContent=h1;document.getElementById("vH2").textContent=h2;document.getElementById("vBody").textContent=body;
  document.getElementById("vLeg").textContent=leg;document.getElementById("vColW").textContent=colW;document.getElementById("vRad").textContent=rad;document.getElementById("vAlpha").textContent=alpha;

  const isPort=(mode==="passport"||mode==="bench"),W=isPort?2234:3508,H=isPort?3158:2480;
  cv.width=Math.round(W*0.42);cv.height=Math.round(H*0.42);
  ctx.save();ctx.scale(0.42,0.42);
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#111111";ctx.lineWidth=3;ctx.strokeRect(20,20,W-40,H-40);

  ctx.textAlign="center";ctx.fillStyle="#111111";ctx.font="bold "+h1+"px 'Times New Roman'";
  const titles={passport:"Цифровой паспорт устойчивости муниципального образования",bench:"Многокритериальный бенчмаркинг муниципальных образований",table:"Интегральный индекс устойчивого развития муниципальных образований",map:"Доля населенных пунктов, не имеющих водопроводов, % (2024 г.)"};
  ctx.fillText(titles[mode],W/2,76);ctx.font="bold "+h2+"px 'Times New Roman'";
  ctx.fillText(mode==="passport"?(mo.lbl+" ("+mo.reg+") — 2024 г."):"Предпросмотр печатного листа А4 (300 / 1200 dpi)",W/2,88+h1);ctx.textAlign="left";

  let y=118+h1;
  if(mode==="passport"){
    if(document.getElementById("cMeta").checked){
      ctx.strokeStyle="#cbd5e1";ctx.strokeRect(45,y,W-90,104);ctx.font="bold "+(body+4)+"px 'Times New Roman'";
      ctx.fillText("Кластер (2024 г.): Б. Эколого-социальный вектор",70,y+40);ctx.fillText("Категория: "+mo.cat,1150,y+40);
      ctx.fillText("Площадь, га: "+Math.round(getVal("Площадь",jk,246113)).toLocaleString("ru-RU"),70,y+84);
      ctx.fillText("Численность, чел.: "+Math.round(getVal("Численность",jk,48352)).toLocaleString("ru-RU"),1150,y+84);y+=124;
    }
    const showSub=document.getElementById("cSubRad").checked,showMid=document.getElementById("cMidTbl").checked,showBlk=document.getElementById("cBlkRad").checked;
    if(showSub||showMid||showBlk){
      const midH=Math.max(rad*2+140,610);ctx.strokeStyle="#cbd5e1";ctx.strokeRect(45,y,W-90,midH);
      const drawR=(cx,cy,lbls,vals)=>{
        const n=lbls.length;ctx.strokeStyle="#cbd5e1";
        Array.of(0.25,0.5,0.75,1).forEach(lv=>{ctx.beginPath();lbls.forEach((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*rad*lv,yy=cy+Math.sin(a)*rad*lv;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy);});ctx.closePath();ctx.stroke();});
        lbls.forEach((l,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;ctx.fillStyle="#111";ctx.font="bold "+body+"px 'Times New Roman'";ctx.textAlign="center";ctx.fillText(l,cx+Math.cos(a)*(rad+30),cy+Math.sin(a)*(rad+22));});
        ctx.beginPath();vals.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*rad*v,yy=cy+Math.sin(a)*rad*v;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy);});ctx.closePath();ctx.fillStyle="rgba(29,78,216,"+alpha+")";ctx.fill();ctx.strokeStyle="#1d4ed8";ctx.lineWidth=3;ctx.stroke();ctx.textAlign="left";
      };
      const sVals=Array.of(getVal("Индекс ЭК",jk,0.72),getVal("Индекс СЦ",jk,0.61),getVal("Индекс УЭ",jk,0.45),getVal("IQ от max",jk,0.64));
      const bVals=Array.of(getVal("ЭК-Подблок 1",jk,0.7),getVal("ЭК-Подблок 2",jk,0.65),getVal("ЭК-Подблок 3",jk,0.8),getVal("СЦ-Подблок 1",jk,0.55),getVal("СЦ-Подблок 2",jk,0.62),getVal("СЦ-Подблок 3",jk,0.68),getVal("УЭ-Подблок 1",jk,0.42),getVal("УЭ-Подблок 2",jk,0.48),getVal("УЭ-Подблок 3",jk,0.51));
      if(showSub){ctx.font="bold "+(body+2)+"px 'Times New Roman'";ctx.textAlign="center";ctx.fillText("Субиндексы устойчивости",300,y+34);ctx.textAlign="left";drawR(300,y+midH/2+18,Array.of("ЭК","СЦ","УЭ","IQ"),sVals);}
      if(showBlk){ctx.font="bold "+(body+2)+"px 'Times New Roman'";ctx.textAlign="center";ctx.fillText("Подблоки показателей",W-300,y+34);ctx.textAlign="left";drawR(W-300,y+midH/2+18,Array.of("ЭК-1","ЭК-2","ЭК-3","СЦ-1","СЦ-2","СЦ-3","УЭ-1","УЭ-2","УЭ-3"),bVals);}
      if(showMid){
        const tx0=showSub?550:70,tw=(showBlk?W-550:W-70)-tx0;
        const rows=Array.of(
          Array.of("Интегральный индекс устойчивого развития",getVal("Интегральный индекс",jk,0.5956).toFixed(4),true),
          Array.of("Экологический субиндекс",sVals.at(0).toFixed(4),true),
          Array.of("  ЭК-1. Качество окружающей среды",bVals.at(0).toFixed(4),false),
          Array.of("  ЭК-2. Износ коммунальных сетей",bVals.at(1).toFixed(4),false),
          Array.of("  ЭК-3. Обращение с отходами",bVals.at(2).toFixed(4),false),
          Array.of("Социальный субиндекс",sVals.at(1).toFixed(4),true),
          Array.of("  СЦ-1. Демография и здравоохранение",bVals.at(3).toFixed(4),false),
          Array.of("  СЦ-2. Социальная инфраструктура",bVals.at(4).toFixed(4),false),
          Array.of("  СЦ-3. Потребительский рынок и ЖКХ",bVals.at(5).toFixed(4),false),
          Array.of("Управленческо-экономический субиндекс",sVals.at(2).toFixed(4),true),
          Array.of("  УЭ-1. Производственно-инвестиционный потенциал",bVals.at(6).toFixed(4),false),
          Array.of("  УЭ-2. Бюджетная обеспеченность",bVals.at(7).toFixed(4),false),
          Array.of("  УЭ-3. Финансовая результативность",bVals.at(8).toFixed(4),false)
        );
        rows.forEach((r,ri)=>{
          const ry=y+20+ri*(body+16);ctx.fillStyle=r.at(2)?"#eef3f8":"#ffffff";ctx.fillRect(tx0,ry,tw,body+14);ctx.strokeStyle="#cbd5e1";ctx.strokeRect(tx0,ry,tw,body+14);
          ctx.fillStyle="#111";ctx.font=(r.at(2)?"bold ":"")+body+"px 'Times New Roman'";ctx.fillText(r.at(0),tx0+12,ry+body+4);
          ctx.font="bold "+body+"px 'Times New Roman'";ctx.textAlign="right";ctx.fillText(r.at(1),tx0+tw-14,ry+body+4);ctx.textAlign="left";
        });
      }
      y+=midH+20;
    }
    if(document.getElementById("c39").checked){
      const cw=(W-128)/3;
      Array.of("Экологический блок","Социальный блок","Управленческо-экономический блок").forEach((bt,bi)=>{
        const bx=45+bi*(cw+19);ctx.fillStyle="#e2e8f0";ctx.fillRect(bx,y,cw,44);ctx.strokeStyle="#64748b";ctx.strokeRect(bx,y,cw,44);
        ctx.fillStyle="#111";ctx.font="bold "+(body+2)+"px 'Times New Roman'";ctx.textAlign="center";ctx.fillText(bt,bx+cw/2,y+30);ctx.textAlign="left";
        for(let r=0;r<12;r++){const ry=y+44+r*145;if(ry+145>H-40)break;ctx.strokeStyle="#cbd5e1";ctx.strokeRect(bx,ry,cw,145);ctx.font=body+"px 'Times New Roman'";ctx.fillText("Показатель "+(r+1)+" — пример текста в колонке",bx+10,ry+42);ctx.font="bold "+(body+2)+"px 'Times New Roman'";ctx.textAlign="right";ctx.fillText("74,20",bx+cw-12,ry+78);ctx.textAlign="left";}
      });
    }
  }else if(mode==="bench"){
    ctx.strokeStyle="#64748b";ctx.strokeRect(45,y,colW,68);ctx.strokeRect(45+colW,y,W-90-colW,68);
    ctx.font="bold "+(body+2)+"px 'Times New Roman'";ctx.fillText("Наименование показателя (колонка "+colW+" px)",60,y+42);ctx.fillText("🔵 "+mo.lbl,65+colW,y+42);
    for(let r=0;r<18;r++){const ry=y+68+r*82;if(ry+82>H-170)break;ctx.strokeStyle="#cbd5e1";ctx.strokeRect(45,ry,colW,82);ctx.strokeRect(45+colW,ry,W-90-colW,82);ctx.font=body+"px 'Times New Roman'";ctx.fillText("ЭК-0"+(r+1)+" — Наименование показателя в расширенной колонке",60,ry+48);}
  }else{
    ctx.strokeStyle="#94a3b8";ctx.strokeRect(45,y,W-90,H-y-180);
    ctx.font="bold "+(body+8)+"px 'Times New Roman'";ctx.textAlign="center";ctx.fillText(mode==="map"?"Карта территории (шрифт подписей: "+leg+" px)":"Таблица динамики 2019–2024 гг. (шрифт строк: "+body+" px)",W/2,(H+y-180)/2);ctx.textAlign="left";
  }

  const fy=H-135,inv=document.getElementById("cInvScale").checked;
  const grd=ctx.createLinearGradient(W-920,0,W-60,0);
  grd.addColorStop(0,"#a50026");grd.addColorStop(0.5,"#ffffbf");grd.addColorStop(1,"#006837");
  ctx.fillStyle=grd;ctx.fillRect(W-920,fy,860,30);ctx.strokeStyle="#475569";ctx.strokeRect(W-920,fy,860,30);
  ctx.fillStyle="#111";ctx.font="bold "+leg+"px 'Times New Roman'";
  ctx.fillText(inv?"71,00 (худшее)":"4,50",W-920,fy+64);ctx.textAlign="right";ctx.fillText(inv?"4,50 (лучшее)":"71,00",W-60,fy+64);ctx.textAlign="left";

  ctx.restore();
  document.getElementById("cfgOut").value=JSON.stringify({mode,h1,h2,body,leg,colW,rad,alpha,invScale:inv},null,2);
}

document.querySelectorAll("input,select").forEach(el=>{el.addEventListener("input",drawPreview);el.addEventListener("change",drawPreview);});
document.getElementById("btnApplySite").onclick=()=>{
  localStorage.setItem("ATLAS_LAYOUT_CFG",document.getElementById("cfgOut").value);
  alert("Настройки сохранены! Обновите основную вкладку Атласа (Ctrl+F5).");
};
document.getElementById("btnDlTest").onclick=()=>{const a=document.createElement("a");a.download="Макет_"+document.getElementById("dMode").value+".png";a.href=cv.toDataURL("image/png");a.click();};
drawPreview();
loadRealAtlasData();
</script>
</body>
</html>
