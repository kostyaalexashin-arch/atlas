<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Интерактивный атлас устойчивого развития МО России</title>
<script src="plotly.min.js"></script><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;font-family:"Times New Roman",Georgia,serif;background:#eef1f5;color:#111}
.workspace{display:flex;gap:12px;padding:8px;height:100vh;width:100vw;margin:0;align-items:center;justify-content:center}
.sidebar{width:310px;flex-shrink:0;height:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.1);padding:8px;display:flex;flex-direction:column;gap:6px;border-radius:4px}
.sidebar select,.sidebar button{font-family:inherit;font-size:13px;height:29px;padding:2px 8px;border-radius:3px;border:1px solid #94a3b8;background:#fff;color:#111}
.sidebar select{width:100%}
.sidebar select:disabled{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.nav-grp{display:flex;align-items:center;gap:4px;width:100%}
.nav-grp select{flex:1;min-width:0}
.btn-nav{width:30px;flex-shrink:0;background:#f1f5f9;cursor:pointer;font-weight:bold;padding:0}
.btn-nav:hover{background:#e2e8f0}
.met-box{flex:1;min-height:120px;border:1px solid #94a3b8;border-radius:3px;padding:6px;display:flex;flex-direction:column;gap:5px}
.side-hdr{font-weight:bold;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.side-nav{display:flex;gap:4px}
.side-nav button{flex:1;height:26px;font-size:12.5px;background:#f1f5f9;cursor:pointer;font-weight:bold}
.side-nav button:hover{background:#e2e8f0}
#selMetric{flex:1;height:auto;min-height:0;width:100%;font-size:12px;border:1px solid #cbd5e1;border-radius:2px;padding:2px}
.pal-dd{position:relative;width:100%}
.pal-btn{width:100%;height:29px;background:#fff;border:1px solid #94a3b8;border-radius:3px;padding:2px 8px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pal-swatch{display:inline-block;width:90px;height:12px;border-radius:2px;border:1px solid #64748b}
.pal-menu{display:none;position:absolute;bottom:100%;left:0;width:100%;background:#fff;color:#111;border:1px solid #94a3b8;border-radius:4px;box-shadow:0 -4px 16px rgba(0,0,0,0.18);z-index:999;margin-bottom:2px}
.pal-menu.open{display:block}
.pal-opt{padding:4px 8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.pal-opt:hover{background:#e2e8f0}
.btn-main{width:100%;background:#0284c7 !important;color:#fff !important;border:none !important;cursor:pointer;font-weight:bold}
.btn-main:hover{background:#0369a1 !important}
.btn-pdf{background:#059669 !important}
.btn-pdf:hover{background:#047857 !important}
.exp-row{display:flex;gap:4px;width:100%}
.exp-row select:first-child{width:98px;flex-shrink:0}
.exp-row select:last-child{flex:1;min-width:0}
.sheet{height:100%;max-width:calc(100vw - 336px);aspect-ratio:297/210;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,0.12);padding:10px 16px 12px 16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-radius:4px}
.sheet-hdr{text-align:center;flex-shrink:0}
.hdr-met{font-size:16px;font-weight:bold;line-height:1.2;min-height:38px;display:flex;align-items:center;justify-content:center}
.hdr-terr{font-size:15px;font-weight:bold;line-height:1.2;margin-top:1px}
.map-stage,#mapDiv{width:100%;flex:1;min-height:0;overflow:hidden;position:relative}
.mo-side-panel{position:absolute;top:2px;right:0;width:22.2%;height:99%;background:#fff;padding:3px 5px;overflow-y:auto;font-size:12px;line-height:1.34;z-index:10}
.mo-side-panel.ark{top:67%;height:32.5%}
.mo-side-hdr{font-weight:bold;font-size:13px;margin-bottom:3px;color:#111}
.mo-side-item{cursor:pointer;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-side-item:hover{background:#e2e8f0;font-weight:bold}
.footer-grid{display:flex;justify-content:space-between;align-items:stretch;gap:36px;margin-top:4px;height:56px;flex-shrink:0}
.leg-box{flex:1;padding:2px 4px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,1fr);grid-template-columns:repeat(3,1fr);gap:2px 10px;align-items:center;font-size:12px}
.leg-box.wide{grid-template-columns:repeat(5,1fr)}
.leg-item{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar-box{width:500px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center}
.cbar-strip{height:18px;border:1px solid #475569;width:100%}
.cbar-ticks{display:flex;justify-content:space-between;font-size:11.5px;margin-top:3px;padding:0 12px;font-weight:bold}
.tbl-wrap{flex:1;min-height:0;overflow-y:auto;border:1px solid #9eb0c2;position:relative}
.sticky-hdr{position:sticky;top:0;z-index:20;background:#fff;text-align:center;font-size:16px;font-weight:bold;padding:6px 8px;border-bottom:1px solid #9eb0c2}
table.dyn-tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.dyn-tbl th{position:sticky;top:33px;z-index:15;background:#eef3f8;border-bottom:1px solid #9eb0c2;border-right:1px solid #9eb0c2;padding:6px 4px;text-align:center}
table.dyn-tbl td{border-bottom:1px solid #cbd5e1;border-right:1px solid #cbd5e1;padding:4px 6px;text-align:center;vertical-align:middle}
table.dyn-tbl td.mo-name{text-align:left}

.bench-panel{display:none;flex-direction:column;gap:5px;flex:1;overflow-y:auto;padding-right:2px}
.bench-panel input{width:100%;height:28px;padding:2px 7px;border:1px solid #94a3b8;border-radius:3px;font-family:inherit;font-size:12px}
.bench-lbl{font-size:11.5px;color:#334155;font-weight:bold;margin-top:2px}
.bench-or{text-align:center;font-size:11px;color:#64748b;margin:1px 0}
.bench-box{border:1px solid #cbd5e1;border-radius:3px;padding:5px;background:#f8fafc;display:flex;flex-direction:column;gap:4px}
.bench-chips{display:flex;flex-direction:column;gap:3px;min-height:24px}
.bench-chip{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #cbd5e1;border-radius:3px;padding:2px 6px;font-size:11.5px}
.bench-chip button{height:18px;width:18px;padding:0;border:none;background:#fee2e2;color:#b91c1c;border-radius:2px;cursor:pointer;font-weight:bold}
.bench-view{width:100%;height:100%;overflow-y:auto;padding:4px 8px}
.bench-hdr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;border:1px solid #cbd5e1;border-radius:4px;padding:8px 12px;margin-bottom:10px;background:#f8fafc}
.bench-mo-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:bold}
.bench-blk-hdr{background:#e2e8f0;font-weight:bold;font-size:13.5px;padding:5px 10px;border-radius:3px;margin:10px 0 6px 0}
.bench-row{display:flex;align-items:center;gap:14px;padding:8px 6px;border-bottom:1px solid #e2e8f0}
.bench-met-name{width:46%;font-size:12.5px;line-height:1.3}
.bench-scale-wrap{flex:1;position:relative;height:36px;display:flex;align-items:center}
.bench-bar{width:100%;height:14px;border:1px solid #64748b;border-radius:2px;position:relative}
.bench-pin{position:absolute;top:-11px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.bench-pin-val{font-size:10.5px;font-weight:bold;background:rgba(255,255,255,0.92);padding:0 3px;border-radius:2px;white-space:nowrap;border:1px solid #cbd5e1}
.bench-clust-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}

.b-tok-sel{height:24px !important;width:44px !important;padding:0 2px !important;font-size:15px !important;text-align:center;cursor:pointer;background:#fff}
.bench-clust-cells{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-height:46px}
.bench-ccell{border:1px solid #475569;border-radius:2px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:10px;text-align:center;line-height:1.1;color:#111;font-weight:bold;position:relative}
.bench-ccell-toks{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:16px;margin-top:2px}
.bench-pin-line{width:1.5px;background:#1e293b;margin:0 auto}
.bench-pin-tok{font-size:16px;line-height:1;filter:drop-shadow(0 1px 1px rgba(255,255,255,0.95));cursor:pointer}
</style></head><body><div class="workspace"><div class="sidebar">
<select id="selMode"><option value="single">Одиночная карта (срез)</option><option value="grid">Сетка динамики (2019–2024)</option><option value="table">Таблица динамики МО (2019–2024)</option><option value="bench">Бенчмаркинг</option></select>
<select id="selBase"><option value="all">Генеральный срез 2024 (2269 МО)</option><option value="coh">Динамическая когорта (193 МО)</option></select>
<select id="selYear"><option value="2024">2024 г.</option><option value="2023">2023 г.</option><option value="2022">2022 г.</option><option value="2021">2021 г.</option><option value="2020">2020 г.</option><option value="2019">2019 г.</option></select>
<div class="nav-grp"><button type="button" class="btn-nav" id="prevFO">◀</button><select id="selFO"><option value="RF">Российская Федерация</option></select><button type="button" class="btn-nav" id="nextFO">▶</button></div>
<div class="nav-grp"><button type="button" class="btn-nav" id="prevReg">◀</button><select id="selReg"><option value="ALL">Весь округ / РФ</option></select><button type="button" class="btn-nav" id="nextReg">▶</button></div>
<div class="bench-panel" id="benchPanel">
<div class="bench-lbl">Основное МО:</div>
<input type="text" id="bSearch1" list="moDatalist" placeholder="🔍 Название МО (Регион)">
<div class="bench-or">или выберите по критериям:</div>
<select id="bCat1"><option value="ALL">Категория (все)</option><option value="1">Крупнейшие (&gt; 1 млн)</option><option value="2">Крупные (250 тыс. – 1 млн)</option><option value="3">Большие (100 – 250 тыс.)</option><option value="4">Средние (50 – 100 тыс.)</option><option value="5">Малые (≤ 50 тыс.)</option></select>
<select id="bFO1"><option value="ALL">ФО (все)</option></select>
<select id="bReg1"><option value="ALL">Регион (все)</option></select>
<select id="bMO1"><option value="">Выберите МО...</option></select>
<div class="bench-box">
<div class="bench-lbl">Сравнить с (до 9 МО):</div>
<div class="bench-chips" id="bChips"></div>
<input type="text" id="bSearch2" list="moDatalist" placeholder="🔍 Добавить МО (Регион)">
<div class="bench-or">или выберите по критериям:</div>
<select id="bCat2"><option value="ALL">Категория (все)</option><option value="1">Крупнейшие (&gt; 1 млн)</option><option value="2">Крупные (250 тыс. – 1 млн)</option><option value="3">Большие (100 – 250 тыс.)</option><option value="4">Средние (50 – 100 тыс.)</option><option value="5">Малые (≤ 50 тыс.)</option></select>
<select id="bFO2"><option value="ALL">ФО (все)</option></select>
<select id="bReg2"><option value="ALL">Регион (все)</option></select>
<select id="bMO2"><option value="">+ Добавить МО...</option></select>
</div>
<select id="bYear"><option value="2024">Год сравнения: 2024 г.</option><option value="2023">2023 г.</option><option value="2022">2022 г.</option><option value="2021">2021 г.</option><option value="2020">2020 г.</option><option value="2019">2019 г.</option></select>
<button type="button" class="btn-main" id="btnBenchRun">Сравнить</button>
<datalist id="moDatalist"></datalist>
</div>
<div class="met-box" id="stdMetBox"><div class="side-hdr"><span>Показатели атласа:</span><span id="verBadge" style="font-size:10.5px;color:#475569;background:#f1f5f9;padding:1px 5px;border-radius:3px;border:1px solid #cbd5e1;">v.2026.11.21 13:02 МСК</span></div><div class="side-nav"><button type="button" id="prevMet">◀ Предыдущий</button><button type="button" id="nextMet">Следующий ▶</button></div><select id="selMetric" size="24"></select></div>
<select id="selScale"><option value="global">Шкала по всей РФ</option><option value="local">Локальная шкала</option></select>
<div class="pal-dd"><button type="button" class="pal-btn" id="palBtn"></button><div class="pal-menu" id="palMenu"></div></div>
<button type="button" class="btn-main" id="btnPng">💾 PNG</button>
<div class="exp-row"><select id="selDpi"><option value="0.32" selected>72 dpi (эскиз)</option><option value="0.45">96 dpi</option><option value="0.72">150 dpi</option><option value="1.0">300 dpi</option></select><select id="selPdfScope"><option value="fo">РФ + 8 ФО</option><option value="cur_fo">Регионы ФО</option><option value="all">Весь атлас</option></select></div>
<button type="button" class="btn-main btn-pdf" id="btnPdf">💾 PDF</button>
</div><div class="sheet" id="sheetBox"><div id="mapDiv" style="padding:40px;font-size:17px;">Загрузка данных атласа...</div></div>
</div><script src="atlas_bench.js?v=20261121130258"></script><script src="atlas_export.js?v=20261121130258"></script><script src="atlas_app.js?v=20261121130258"></script></body></html>
