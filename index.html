<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Интерактивный атлас устойчивого развития МО России</title>
<script src="plotly.min.js"></script><style>
body{font-family:"Times New Roman",Georgia,serif;margin:0;background:#f4f6f9;color:#111}
.toolbar{background:#1e293b;color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar select,.toolbar button{font-family:inherit;font-size:13px;padding:5px 9px;border-radius:4px;border:1px solid #cbd5e1}
.toolbar button.btn-main{background:#0284c7;color:#fff;border:none;cursor:pointer;font-weight:bold}
.pal-dd{position:relative;display:inline-block}
.pal-btn{background:#fff;color:#111;border:1px solid #cbd5e1;border-radius:4px;padding:4px 9px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:168px}
.pal-swatch{display:inline-block;width:72px;height:12px;border-radius:2px;border:1px solid #64748b}
.pal-menu{display:none;position:absolute;top:100%;left:0;background:#fff;color:#111;border:1px solid #94a3b8;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,0.2);z-index:999;min-width:195px;margin-top:2px}
.pal-menu.open{display:block}
.pal-opt{padding:6px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.pal-opt:hover{background:#e2e8f0}
.main-box{max-width:1620px;margin:10px auto;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.1);padding:12px}
#mapDiv{width:100%;height:840px}
table.dyn-tbl{width:100%;border-collapse:collapse;font-size:13px}
table.dyn-tbl th{background:#eef3f8;border:1px solid #9eb0c2;padding:7px;text-align:center}
table.dyn-tbl td{border:1px solid #cbd5e1;padding:5px 8px;text-align:center;vertical-align:middle}
table.dyn-tbl td.mo-name{text-align:left}
.tbl-legend{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 14px;background:#f8fafc;border:1px solid #cbd5e1;margin-bottom:12px;gap:12px;font-size:13px}
</style></head><body><div class="toolbar">
<select id="selMode"><option value="single">Одиночная карта (срез)</option><option value="grid">Сетка динамики (2019–2024)</option><option value="table">Таблица динамики МО (2019–2024)</option></select>
<select id="selBase"><option value="all">Генеральный срез 2024 (2269 МО)</option><option value="coh">Динамическая когорта (193 МО)</option></select>
<select id="selYear"><option value="2024">2024 г.</option><option value="2023">2023 г.</option><option value="2022">2022 г.</option><option value="2021">2021 г.</option><option value="2020">2020 г.</option><option value="2019">2019 г.</option></select>
<select id="selFO"><option value="RF">Российская Федерация</option></select>
<select id="selReg"><option value="ALL">Весь округ / РФ</option></select>
<select id="selMetric" style="max-width:340px;"></select>
<select id="selScale"><option value="global">Шкала по всей РФ</option><option value="local">Локальная шкала</option></select>
<div class="pal-dd"><button type="button" class="pal-btn" id="palBtn"></button><div class="pal-menu" id="palMenu"></div></div>
<button class="btn-main" id="btnPng">Скачать PNG (300 DPI)</button>
</div><div class="main-box" id="wrap"><div id="mapDiv" style="padding:40px;font-size:17px;">Загрузка геометрии и показателей...</div></div><script>
let GEO=null,DATA=null,currentPal="RdYlGn";
const PALETTES={
  "RdYlGn":Array.of("#a50026","#d73027","#f46d43","#fdae61","#fee08b","#ffffbf","#d9ef8b","#a6d96a","#66bd63","#1a9850","#006837"),
  "YlGnBu":Array.of("#ffffd9","#edf8b1","#c7e9b4","#7fcdbb","#41b6c4","#1d91c0","#225ea8","#253494","#081d58"),
  "Viridis":Array.of("#440154","#482878","#3e4989","#31688e","#26828e","#1f9e89","#35b779","#6ece58","#b5de2b","#fde725"),
  "PuBuGn":Array.of("#fff7fb","#ece2f0","#d0d1e6","#a6bddb","#67a9cf","#3690c0","#02818a","#016c59","#014636"),
  "YlOrRd":Array.of("#ffffcc","#ffeda0","#fed976","#feb24c","#fd8d3c","#fc4e2a","#e31a1c","#bd0026","#800026"),
  "Blues":Array.of("#f7fbff","#deebf7","#c6dbef","#9ecae1","#6baed6","#4292c6","#2171b5","#08519c","#08306b")
};
const btnP=document.getElementById("palBtn"),menuP=document.getElementById("palMenu");
const updBtn=p=>{const g="linear-gradient(to right,"+PALETTES[p].join(",")+")";btnP.innerHTML='<span class="pal-swatch" style="background:'+g+'"></span><span>'+p+'</span><span>▾</span>';};
Object.keys(PALETTES).forEach(p=>{const it=document.createElement("div");it.className="pal-opt";const g="linear-gradient(to right,"+PALETTES[p].join(",")+")";it.innerHTML='<span>'+p+'</span><span class="pal-swatch" style="background:'+g+'"></span>';it.onclick=()=>{currentPal=p;updBtn(p);menuP.classList.remove("open");render();};menuP.appendChild(it);});
btnP.onclick=e=>{e.stopPropagation();menuP.classList.toggle("open");};
document.addEventListener("click",()=>menuP.classList.remove("open"));updBtn(currentPal);
const fmtNum=(v,d)=>(v===null||v===undefined||v===""||isNaN(Number(v)))?"н/д":Number(v).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
function markerSvg(c,f){const s="#1e293b";if(c==="1")return '<svg width="22" height="22"><rect x="3" y="3" width="16" height="16" fill="'+f+'" stroke="'+s+'" stroke-width="1.2"/></svg>';if(c==="2")return '<svg width="22" height="22"><polygon points="11,2 20,11 11,20 2,11" fill="'+f+'" stroke="'+s+'" stroke-width="1.2"/></svg>';if(c==="3")return '<svg width="22" height="22"><polygon points="11,2 20,19 2,19" fill="'+f+'" stroke="'+s+'" stroke-width="1.2"/></svg>';if(c==="4")return '<svg width="22" height="22"><circle cx="11" cy="11" r="8" fill="'+f+'" stroke="'+s+'" stroke-width="1.2"/></svg>';return '<svg width="22" height="22"><polygon points="11,2 20,9 16,19 6,19 2,9" fill="'+f+'" stroke="'+s+'" stroke-width="1.2"/></svg>';}
function getCenter(g){let sx=0,sy=0,n=0;const w=c=>{if(typeof c.at(0)==="number"){sx+=c.at(0);sy+=c.at(1);n++;}else c.forEach(w);};if(g&&g.coordinates)w(g.coordinates);return n?{lon:sx/n,lat:sy/n}:{lon:0,lat:0};}
const buildScale=arr=>arr.map((c,i)=>Array.of(arr.length===1?0:i/(arr.length-1),c));
const getJson=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+": HTTP "+r.status);return r.json();});
Promise.all(Array.of(getJson("geo_plotly.json"),getJson("metrics_data.json"))).then(res=>{try{
  GEO=res.at(0);DATA=res.at(1);GEO.features.forEach(f=>{f.properties._cent=getCenter(f.geometry);});
  const sFO=document.getElementById("selFO"),sReg=document.getElementById("selReg"),sMet=document.getElementById("selMetric");
  DATA.fos.forEach(f=>sFO.add(new Option(f+" ФО",f)));const gm={};
  DATA.metrics.forEach(m=>{if(!gm[m.group]){gm[m.group]=document.createElement("optgroup");gm[m.group].label=m.group;sMet.add(gm[m.group]);}gm[m.group].appendChild(new Option(m.id+" — "+m.title,m.id));});
  sFO.onchange=()=>{sReg.innerHTML='<option value="ALL">Весь округ / РФ</option>';if(sFO.value!=="RF")(DATA.fo_to_regs[sFO.value]||Array.of()).forEach(r=>sReg.add(new Option(r,r)));render();};
  Array.of("selMode","selBase","selYear","selReg","selMetric","selScale").forEach(id=>document.getElementById(id).onchange=render);
  document.getElementById("btnPng").onclick=()=>{const d=document.getElementById("mapDiv");if(!d)return alert("Переключитесь в режим карты или сетки.");Plotly.downloadImage(d,{format:"png",width:3300,height:2240,filename:"Карта_"+document.getElementById("selMetric").value});};
  render();
}catch(e){document.getElementById("mapDiv").innerHTML="Ошибка: "+e.message;}}).catch(e=>{document.getElementById("mapDiv").innerHTML="Ошибка загрузки: "+e.message;});
function render(){
  if(!GEO||!DATA)return;
  const mode=document.getElementById("selMode").value,base=document.getElementById("selBase").value,yr=document.getElementById("selYear").value,mId=document.getElementById("selMetric").value,fo=document.getElementById("selFO").value,reg=document.getElementById("selReg").value,scMode=document.getElementById("selScale").value;
  const mMeta=DATA.metrics.find(x=>x.id===mId)||DATA.metrics.at(0),wrap=document.getElementById("wrap");
  const feats=GEO.features.filter(f=>(fo==="RF"||f.properties.fo===fo)&&(reg==="ALL"||f.properties.region===reg));
  const terrTitle=reg!=="ALL"?reg:(fo!=="RF"?fo+" федеральный округ":"Российская Федерация");
  const yrs=Array.of("2019","2020","2021","2022","2023","2024"),actCol=PALETTES[currentPal]||PALETTES["RdYlGn"],plScale=buildScale(actCol),CORE="#e6007e";
  if(mode==="table"){
    const rows=feats.filter(f=>f.properties._map_status==="В_выборке"&&f.properties.coh),refF=(scMode==="global")?GEO.features:feats,allV=Array.of();
    yrs.forEach(y=>{const ym=DATA.panel[mId]?.[y]||{};refF.filter(f=>f.properties._map_status==="В_выборке"&&f.properties.coh).forEach(f=>{const v=Number(ym[f.properties.join_key]);if(!isNaN(v))allV.push(v);});});
    allV.sort((a,b)=>a-b);const zmin=allV.at(Math.floor(allV.length*0.02))??0,zmax=allV.at(Math.min(allV.length-1,Math.floor(allV.length*0.98)))??1;
    const pal=mMeta.inv?actCol.slice().reverse():actCol,getHex=v=>{if(v===null||v===undefined||isNaN(Number(v)))return"#eeeeee";if(zmax<=zmin)return pal.at(Math.floor(pal.length/2));return pal.at(Math.max(0,Math.min(pal.length-1,Math.floor(((Number(v)-zmin)/(zmax-zmin))*pal.length))));};
    const sHex=actCol.at(Math.floor(actCol.length*0.75));
    const elH=document.createElement("h2");elH.style.cssText="text-align:center;margin:6px 0 10px 0;";elH.textContent=mMeta.title+" (2019–2024 гг.)";
    const elL=document.createElement("div");elL.className="tbl-legend";
    elL.innerHTML='<div>'+markerSvg("1",sHex)+' Крупнейшие (>1 млн) &nbsp; '+markerSvg("2",sHex)+' Крупные (250 тыс.–1 млн) &nbsp; '+markerSvg("3",sHex)+' Большие (100–250 тыс.) &nbsp; '+markerSvg("4",sHex)+' Средние (50–100 тыс.) &nbsp; '+markerSvg("5",sHex)+' Малые (≤50 тыс.)</div><div>Палитра: <b>'+currentPal+'</b> | Шкала: <b>'+fmtNum(zmin,mMeta.dec)+'</b> — <b>'+fmtNum(zmax,mMeta.dec)+'</b></div>';
    const tbl=document.createElement("table");tbl.className="dyn-tbl";
    const thead=tbl.insertRow();Array.of("Регион","Муниципальное образование","2019 г.","2020 г.","2021 г.","2022 г.","2023 г.","2024 г.").forEach(t=>{const th=document.createElement("th");th.textContent=t;thead.appendChild(th);});
    rows.forEach(f=>{const tr=tbl.insertRow(),id=f.properties.join_key;const c0=tr.insertCell();c0.textContent=f.properties.region;const c1=tr.insertCell();c1.className="mo-name";c1.innerHTML="<b>"+f.properties._lbl+"</b>";yrs.forEach(y=>{const td=tr.insertCell(),v=DATA.panel[mId]?.[y]?.[id],cc=DATA.panel_cats?.[y]?.[id]||"5";td.innerHTML='<div>'+markerSvg(cc,getHex(v))+'</div><div style="font-size:12px;margin-top:2px;">'+fmtNum(v,mMeta.dec)+'</div>';});});
    wrap.innerHTML="";wrap.append(elH,elL,tbl);return;
  }
  wrap.innerHTML='<div id="mapDiv"></div>';const subGeo={type:"FeatureCollection",features:feats},projObj=(fo==="RF"||fo==="Дальневосточный")?{type:"mercator",rotation:{lon:105}}:{type:"mercator"};
  if(mode==="grid"){
    const refF=(scMode==="global")?GEO.features:feats,allV=Array.of();
    yrs.forEach(y=>{const ym=DATA.panel[mId]?.[y]||{};refF.filter(f=>f.properties._map_status==="В_выборке"&&f.properties.coh).forEach(f=>{const v=Number(ym[f.properties.join_key]);if(!isNaN(v))allV.push(v);});});
    allV.sort((a,b)=>a-b);const zmin=allV.at(Math.floor(allV.length*0.02))??0,zmax=allV.at(Math.min(allV.length-1,Math.floor(allV.length*0.98)))??1;
    const traces=Array.of(),layout={title:{text:"<b>"+terrTitle+":</b> "+mMeta.title+" (2019–2024 гг.)",font:{family:"Times New Roman",size:18}},margin:{l:10,r:10,t:65,b:20},height:850,annotations:Array.of()};
    yrs.forEach((yK,idx)=>{const gK=idx===0?"geo":"geo"+(idx+1),col=idx%3,row=Math.floor(idx/3),x0=col*0.335,x1=x0+0.32,y1=1.0-row*0.50,y0=y1-0.44;layout[gK]={domain:{x:Array.of(x0,x1),y:Array.of(y0,y1)},fitbounds:"locations",visible:false,projection:projObj};layout.annotations.push({text:"<b>"+yK+" г.</b>",x:(x0+x1)/2,y:y1+0.02,xref:"paper",yref:"paper",showarrow:false,font:{size:14}});traces.push({type:"choropleth",geo:gK,geojson:subGeo,featureidkey:"properties.join_key",locations:feats.map(f=>f.properties.join_key),z:feats.map(()=>0),colorscale:Array.of(Array.of(0,"#f1f5f9"),Array.of(1,"#f1f5f9")),showscale:false,hoverinfo:"skip",marker:{line:{color:"#cbd5e1",width:0.3}}});const ym=DATA.panel[mId]?.[yK]||{},pts=feats.filter(f=>f.properties._map_status==="В_выборке"&&f.properties.coh&&ym[f.properties.join_key]!==undefined);traces.push({type:"scattergeo",geo:gK,lon:pts.map(f=>f.properties._cent.lon),lat:pts.map(f=>f.properties._cent.lat),text:pts.map(f=>"<b>"+f.properties._lbl+"</b> ("+yK+" г.): <b>"+fmtNum(ym[f.properties.join_key],mMeta.dec)+"</b>"),hoverinfo:"text",showlegend:false,marker:{size:fo==="RF"?6:10,color:pts.map(f=>Number(ym[f.properties.join_key])),cmin:zmin,cmax:zmax,colorscale:plScale,reversescale:mMeta.inv,showscale:(idx===5),colorbar:{title:mMeta.id,len:0.65,x:1.01},line:{color:"#1e293b",width:0.6}}});});
    Plotly.newPlot("mapDiv",traces,layout,{responsive:true});return;
  }
  const valMap=(base==="all"&&yr==="2024")?(DATA.v2024[mId]||{}):(DATA.panel[mId]?.[yr]||{}),traces=Array.of();
  traces.push({type:"choropleth",geojson:subGeo,featureidkey:"properties.join_key",locations:feats.map(f=>f.properties.join_key),z:feats.map(()=>0),text:feats.map(f=>f.properties._lbl+" ("+f.properties.region+") — "+f.properties._map_status),hoverinfo:"text",colorscale:Array.of(Array.of(0,"#eceff4"),Array.of(1,"#eceff4")),showscale:false,marker:{line:{color:"#9aa2ae",width:0.35}}});
  const inF=feats.filter(f=>f.properties._map_status==="В_выборке"&&(base==="all"||f.properties.coh));
  if(mMeta.cat){Object.entries(DATA.cluster_colors).forEach(p=>{const cn=p.at(0),ch=p.at(1),cf=inF.filter(f=>valMap[f.properties.join_key]===cn);if(cf.length>0)traces.push({type:"choropleth",geojson:subGeo,featureidkey:"properties.join_key",name:cn,locations:cf.map(f=>f.properties.join_key),z:cf.map(()=>1),text:cf.map(f=>"<b>"+f.properties._lbl+"</b><br>"+f.properties.region+"<br>"+cn),hoverinfo:"text",colorscale:Array.of(Array.of(0,ch),Array.of(1,ch)),showscale:false,showlegend:true,marker:{line:{color:"#64748b",width:0.35}}});});}
  else{const refF=(scMode==="global")?GEO.features:feats,allV=refF.filter(f=>f.properties._map_status==="В_выборке"&&(base==="all"||f.properties.coh)).map(f=>Number(valMap[f.properties.join_key])).filter(v=>!isNaN(v)).sort((a,b)=>a-b);const zmin=allV.at(Math.floor(allV.length*0.02))??0,zmax=allV.at(Math.min(allV.length-1,Math.floor(allV.length*0.98)))??1;traces.push({type:"choropleth",geojson:subGeo,featureidkey:"properties.join_key",locations:inF.map(f=>f.properties.join_key),z:inF.map(f=>valMap[f.properties.join_key]??null),zmin:zmin,zmax:zmax,text:inF.map(f=>"<b>"+f.properties._lbl+"</b><br>"+f.properties.region+"<br>Значение: <b>"+fmtNum(valMap[f.properties.join_key],mMeta.dec)+"</b>"),hoverinfo:"text",colorscale:plScale,reversescale:mMeta.inv,showlegend:false,colorbar:{title:mMeta.id,len:0.72},marker:{line:{color:"#64748b",width:0.35}}});}
  const coreF=feats.filter(f=>f.properties.is_center&&f.properties._map_status==="В_выборке");
  if(coreF.length>0){
    if(reg==="ALL"){
      const showTxt=(fo!=="RF");
      traces.push({type:"scattergeo",mode:showTxt?"markers+text":"markers",name:"Ядро региона (макс. население)",lon:coreF.map(f=>f.properties._cent.lon),lat:coreF.map(f=>f.properties._cent.lat),text:coreF.map(f=>f.properties._lbl),hovertext:coreF.map(f=>"<b>Ядро региона:</b> "+f.properties._lbl+" ("+f.properties.region+")"),hoverinfo:"text",textposition:"top center",textfont:{family:"Times New Roman",size:11,color:"#111111"},showlegend:true,marker:{size:fo==="RF"?6:9,color:CORE,line:{color:"#ffffff",width:1.0}}});
    }else{
      traces.push({type:"choropleth",geojson:subGeo,featureidkey:"properties.join_key",locations:coreF.map(f=>f.properties.join_key),z:coreF.map(()=>1),colorscale:Array.of(Array.of(0,"rgba(0,0,0,0)"),Array.of(1,"rgba(0,0,0,0)")),showscale:false,showlegend:false,hoverinfo:"skip",marker:{line:{color:CORE,width:2.8}}});

</script></body></html>
