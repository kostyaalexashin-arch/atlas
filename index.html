<title>Интерактивный атлас устойчивого развития МО России</title>
<script src="plotly.min.js"></script><style>
body{font-family:"Times New Roman",Georgia,serif;margin:0;background:#eef1f5;color:#111}
.toolbar{background:#1e293b;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar button{font-family:inherit;font-size:13px;padding:4px 8px;border-radius:4px;border:1px solid #cbd5e1}
.toolbar select:disabled{background:#cbd5e1;color:#475569;cursor:not-allowed}
.nav-grp{display:inline-flex;align-items:center;gap:2px}
.btn-nav{background:#334155;color:#fff;border:1px solid #64748b;cursor:pointer;padding:4px 7px;font-weight:bold}
.btn-nav:hover{background:#475569}
.toolbar button.btn-main{background:#0284c7;color:#fff;border:none;cursor:pointer;font-weight:bold;padding:5px 12px}
.pal-dd{position:relative;display:inline-block}
.pal-btn{background:#fff;color:#111;border:1px solid #cbd5e1;border-radius:4px;padding:4px 8px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;min-width:150px}
.pal-swatch{display:inline-block;width:64px;height:12px;border-radius:2px;border:1px solid #64748b}
.pal-menu{display:none;position:absolute;top:100%;left:0;background:#fff;color:#111;border:1px solid #94a3b8;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,0.2);z-index:999;min-width:185px;margin-top:2px}
.pal-menu.open{display:block}
.pal-opt{padding:5px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.pal-opt:hover{background:#e2e8f0}
.workspace{display:flex;gap:10px;padding:10px;align-items:flex-start;max-width:1920px;margin:0 auto}
.sidebar{width:315px;flex-shrink:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.1);padding:10px;box-sizing:border-box;border-radius:4px}
.side-hdr{font-weight:bold;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.side-nav{display:flex;gap:4px;margin-bottom:6px}
.side-nav button{flex:1;padding:4px 6px;font-family:inherit;font-size:12.5px;background:#f1f5f9;border:1px solid #94a3b8;border-radius:3px;cursor:pointer;font-weight:bold}
#selMetric{width:100%;height:775px;font-family:inherit;font-size:12.5px;border:1px solid #cbd5e1;border-radius:3px;padding:2px}
.sheet{flex:1;min-width:0;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,0.12);padding:12px 16px 14px 16px;box-sizing:border-box}
.sheet-hdr{text-align:center;margin-bottom:4px}
.hdr-met{font-size:17px;font-weight:bold;line-height:1.22;min-height:42px;display:flex;align-items:center;justify-content:center}
.hdr-terr{font-size:16px;font-weight:bold;line-height:1.25;margin-top:2px}
#mapDiv{width:100%;height:740px}
.footer-grid{display:flex;justify-content:space-between;align-items:stretch;gap:42px;margin-top:8px;height:62px}
.leg-box{flex:1;padding:4px 6px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,1fr);grid-template-columns:repeat(3,1fr);gap:4px 12px;align-items:center;font-size:12.5px;box-sizing:border-box}
.leg-box.wide{grid-template-columns:repeat(5,1fr)}
.leg-item{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar-box{width:540px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding:2px 0;box-sizing:border-box}
.cbar-strip{height:20px;border:1px solid #475569;width:100%;box-sizing:border-box}
.cbar-ticks{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;padding:0 14px;font-weight:bold}
.tbl-wrap{max-height:715px;overflow-y:auto;border:1px solid #9eb0c2;position:relative;margin-bottom:8px}
.sticky-hdr{position:sticky;top:0;z-index:20;background:#fff;text-align:center;font-size:17px;font-weight:bold;padding:8px 10px;border-bottom:1px solid #9eb0c2}
table.dyn-tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px}
table.dyn-tbl th{position:sticky;top:37px;z-index:15;background:#eef3f8;border-bottom:1px solid #9eb0c2;border-right:1px solid #9eb0c2;padding:7px 4px;text-align:center}
table.dyn-tbl td{border-bottom:1px solid #cbd5e1;border-right:1px solid #cbd5e1;padding:5px 8px;text-align:center;vertical-align:middle}
table.dyn-tbl td.mo-name{text-align:left}

.map-stage{position:relative;width:100%;height:740px}
.mo-side-panel{position:absolute;top:4px;right:0;width:22.2%;height:732px;background:#fff;padding:4px 6px;box-sizing:border-box;overflow-y:auto;font-size:12.5px;line-height:1.38;z-index:10}
.mo-side-panel.ark{top:67%;height:32.5%}
.mo-side-hdr{font-weight:bold;font-size:13.5px;margin-bottom:4px;color:#111}
.mo-side-item{cursor:pointer;padding:1.5px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-side-item:hover{background:#e2e8f0;font-weight:bold}
