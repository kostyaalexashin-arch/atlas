body{font-family:"Times New Roman",Georgia,serif;margin:0;background:#eef1f5;color:#111}
.toolbar{background:#1e293b;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar button{font-family:inherit;font-size:13px;padding:4px 8px;border-radius:4px;border:1px solid #cbd5e1}
.toolbar select:disabled{background:#cbd5e1;color:#475569;cursor:not-allowed}
.nav-grp{display:inline-flex;align-items:center;gap:2px}
.btn-nav{background:#334155;color:#fff;border:1px solid #64748b;cursor:pointer;padding:4px 7px;font-weight:bold}
.btn-nav:hover{background:#475569}
.toolbar button.btn-main{background:#0284c7;color:#fff;border:none;cursor:pointer;font-weight:bold;padding:5px 12px;margin-left:auto}
.pal-dd{position:relative;display:inline-block}
.pal-btn{background:#fff;color:#111;border:1px solid #cbd5e1;border-radius:4px;padding:4px 8px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;min-width:150px}

.pal-menu.open{display:block}
.pal-opt{padding:5px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.pal-opt:hover{background:#e2e8f0}
.workspace{display:flex;gap:10px;padding:10px;align-items:flex-start;max-width:1920px;margin:0 auto}
.sidebar{width:315px;flex-shrink:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.1);padding:10px;box-sizing:border-box;border-radius:4px}
.side-hdr{font-weight:bold;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.side-nav{display:flex;gap:4px;margin-bottom:6px}
.side-nav button{flex:1;padding:4px 6px;font-family:inherit;font-size:12.5px;background:#f1f5f9;border:1px solid #94a3b8;border-radius:3px;cursor:pointer;font-weight:bold}
.side-nav button:hover{background:#e2e8f0}
#selMetric{width:100%;height:775px;font-family:inherit;font-size:12.5px;border:1px solid #cbd5e1;border-radius:3px;padding:2px}
#selMetric optgroup{font-weight:bold;background:#f8fafc;color:#1e293b}
#selMetric option{padding:3px 5px;white-space:normal}
.sheet{flex:1;min-width:0;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,0.12);padding:12px 16px 16px 16px;box-sizing:border-box}
#mapDiv{width:100%;height:810px}
.footer-grid{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:8px;min-height:66px}
.leg-box{flex:1;border:1px solid #cbd5e1;padding:7px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px 12px;align-items:center;font-size:12.5px;background:#fff;box-sizing:border-box}
.leg-box.wide{grid-template-columns:repeat(5,1fr)}
.leg-item{display:flex;align-items:center;gap:7px;white-space:nowrap}
.cbar-box{width:560px;display:flex;flex-direction:column;justify-content:flex-start;padding:0;margin:0}
.cbar-strip{height:16px;border:1px solid #475569;width:100%;box-sizing:border-box}
.cbar-ticks{display:flex;justify-content:space-between;font-size:11.5px;margin-top:3px;padding:0 12px}
.cbar-title{text-align:center;font-weight:bold;font-size:12.5px;margin-top:3px}
.tbl-wrap{max-height:715px;overflow-y:auto;border:1px solid #9eb0c2;position:relative;margin-bottom:8px}
.sticky-hdr{position:sticky;top:0;z-index:20;background:#fff;text-align:center;font-size:17px;font-weight:bold;padding:8px 10px;border-bottom:1px solid #9eb0c2;line-height:1.25}
table.dyn-tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px}
table.dyn-tbl th{position:sticky;top:37px;z-index:15;background:#eef3f8;border-bottom:1px solid #9eb0c2;border-right:1px solid #9eb0c2;padding:7px 4px;text-align:center}
table.dyn-tbl td{border-bottom:1px solid #cbd5e1;border-right:1px solid #cbd5e1;padding:5px 8px;text-align:center;vertical-align:middle;word-wrap:break-word}
table.dyn-tbl td.mo-name{text-align:left}
