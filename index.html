<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Атлас устойчивого развития МО России</title>
<style>
  body { font-family: "Times New Roman", Georgia, serif; margin: 0; background: #f4f6f9; color: #111; }
  .toolbar { background: #1e293b; color: #fff; padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar select, .toolbar button { font-family: inherit; font-size: 13px; padding: 5px 9px; border-radius: 4px; border: 1px solid #cbd5e1; }
  .toolbar button { background: #0284c7; color: #fff; border: none; cursor: pointer; font-weight: bold; }
  .toolbar button:hover { background: #0369a1; }
  .canvas-wrap { display: flex; justify-content: center; padding: 14px; }
  svg#atlas { background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 100%; height: auto; }
  .tooltip { position: fixed; pointer-events: none; background: rgba(15,23,42,0.94); color: #fff; padding: 8px 11px; border-radius: 5px; font-size: 13px; display: none; z-index: 99; max-width: 300px; line-height: 1.35; }
  table.dyn-tbl { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  table.dyn-tbl th { background: #eef3f8; border: 1px solid #9eb0c2; padding: 6px; text-align: center; }
  table.dyn-tbl td { border: 1px solid #e2e8f0; padding: 5px 8px; text-align: center; }
  table.dyn-tbl td.mo-name { text-align: left; }
</style>
</head>
<body>
<div class="toolbar">
  <select id="selMode">
    <option value="single">Одиночная карта (срез)</option>
    <option value="grid">Сетка динамики (2019–2024)</option>
    <option value="table">Таблица динамики МО (2019–2024)</option>
  </select>
  <select id="selBase">
    <option value="all">Генеральный срез 2024 (2269 МО)</option>
    <option value="coh">Динамическая когорта (193 МО)</option>
  </select>
  <select id="selYear"><option value="2024">2024 г.</option><option value="2023">2023 г.</option><option value="2022">2022 г.</option><option value="2021">2021 г.</option><option value="2020">2020 г.</option><option value="2019">2019 г.</option></select>
  <select id="selFO"><option value="RF">Российская Федерация</option></select>
  <select id="selReg"><option value="ALL">Весь округ / РФ</option></select>
  <select id="selMetric" style="max-width:340px;"></select>
  <select id="selScale"><option value="global">Шкала по всей РФ</option><option value="local">Локальная шкала</option></select>
  <button id="btnPng">Скачать PNG (300 DPI)</button>
</div>
<div class="canvas-wrap" id="viewArea"><div id="loader" style="padding:60px;font-size:18px;">Загрузка данных атласа...</div></div>
<div class="tooltip" id="tip"></div>
<script>
let GEO = null, DATA = null;
const NS = "http://w3.org";
const YLGNBU = ["#ffffd9","#edf8b1","#c7e9b4","#7fcdbb","#41b6c4","#1d91c0","#225ea8","#253494","#081d58"];

function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

function fmtNum(v, dec) {
  if (v === null || v === undefined || v === "" || isNaN(Number(v))) return "н/д";
  return Number(v).toLocaleString("ru-RU", {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

function getBounds(feats) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const scan = arr => {
    if (typeof arr.at(0) === "number") {
      const x = arr.at(0), y = arr.at(1);
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    } else arr.forEach(scan);
  };
  feats.forEach(f => { if (f.geometry) scan(f.geometry.coordinates); });
  return {x0, y0, x1, y1};
}

function geomToPath(geom, mapX, mapY) {
  if (!geom) return "";
  const polys = geom.type === "Polygon" ? Array.of(geom.coordinates) : geom.coordinates;
  let d = "";
  polys.forEach(poly => {
    poly.forEach(ring => {
      ring.forEach((pt, idx) => {
        d += (idx === 0 ? "M" : "L") + mapX(pt.at(0)).toFixed(1) + "," + mapY(pt.at(1)).toFixed(1);
      });
      d += "Z";
    });
  });
  return d;
}

function geomCentroid(geom) {
  let sx = 0, sy = 0, n = 0;
  const walk = arr => {
    if (typeof arr.at(0) === "number") { sx += arr.at(0); sy += arr.at(1); n++; }
    else arr.forEach(walk);
  };
  if (geom) walk(geom.coordinates);
  return n ? Array.of(sx / n, sy / n) : Array.of(0, 0);
}

Promise.all([fetch("geo_2024.json").then(r=>r.json()), fetch("metrics_data.json").then(r=>r.json())]).then(([g, d]) => {
  GEO = g; DATA = d;
  const sFO = document.getElementById("selFO"), sReg = document.getElementById("selReg"), sMet = document.getElementById("selMetric");
  d.fos.forEach(f => sFO.add(new Option(f + " ФО", f)));
  const grpMap = {};
  d.metrics.forEach(m => {
    if (!grpMap[m.group]) { grpMap[m.group] = document.createElement("optgroup"); grpMap[m.group].label = m.group; sMet.add(grpMap[m.group]); }
    grpMap[m.group].appendChild(new Option(m.id + " — " + m.title, m.id));
  });
  sFO.onchange = () => {
    sReg.innerHTML = '<option value="ALL">Весь округ / РФ</option>';
    if (sFO.value !== "RF") (d.fo_to_regs[sFO.value] || Array.of()).forEach(r => sReg.add(new Option(r, r)));
    render();
  };
  Array.of("selMode","selBase","selYear","selReg","selMetric","selScale").forEach(id => document.getElementById(id).onchange = render);
  document.getElementById("btnPng").onclick = downloadPng;
  render();
}).catch(err => {
  document.getElementById("viewArea").innerHTML = '<div style="color:red;padding:40px;">Ошибка загрузки: ' + err + '</div>';
});

function getFilteredFeatures() {
  const fo = document.getElementById("selFO").value, reg = document.getElementById("selReg").value;
  return GEO.features.filter(f => (fo === "RF" || f.properties.fo === fo) && (reg === "ALL" || f.properties.reg === reg));
}

function render() {
  if (!GEO || !DATA) return;
  const mode = document.getElementById("selMode").value, base = document.getElementById("selBase").value;
  const yr = document.getElementById("selYear").value, mId = document.getElementById("selMetric").value;
  const scMode = document.getElementById("selScale").value;
  const mMeta = DATA.metrics.find(x => x.id === mId) || DATA.metrics.at(0);
  const area = document.getElementById("viewArea");

  if (mode === "table") {
    const feats = getFilteredFeatures().filter(f => f.properties.st === "В_выборке" && f.properties.coh);
    let html = '<div style="width:1280px;background:#fff;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,0.12);"><h2 style="text-align:center;">' + mMeta.title + ' (2019–2024 гг.)</h2><table class="dyn-tbl"><tr><th>Регион</th><th>Муниципальное образование</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th><th>2023</th><th>2024</th></tr>';
    feats.forEach(f => {
      const id = f.properties.id;
      html += '<tr><td>' + f.properties.reg + '</td><td class="mo-name">' + f.properties.name + '</td>';
      Array.of("2019","2020","2021","2022","2023","2024").forEach(y => {
        const val = (DATA.panel[mId] && DATA.panel[mId][y]) ? DATA.panel[mId][y][id] : null;
        html += '<td>' + fmtNum(val, mMeta.dec) + '</td>';
      });
      html += '</tr>';
    });
    area.innerHTML = html + '</table></div>';
    return;
  }

  area.innerHTML = '<svg id="atlas" viewBox="0 0 1650 1120" width="1320" height="896"></svg>';
  const svg = document.getElementById("atlas");
  const feats = getFilteredFeatures();
  const valMap = (base === "all" && yr === "2024") ? (DATA.v2024[mId] || {}) : ((DATA.panel[mId] && DATA.panel[mId][yr]) || {});
  const refFeats = (scMode === "global") ? GEO.features : feats;
  const numVals = refFeats.filter(f => f.properties.st === "В_выборке" && (base === "all" || f.properties.coh)).map(f => Number(valMap[f.properties.id])).filter(v => !isNaN(v)).sort((a,b)=>a-b);
  const vmin = numVals.length ? numVals.at(Math.floor(numVals.length * 0.02)) : 0;
  const vmax = numVals.length ? numVals.at(Math.min(numVals.length - 1, Math.floor(numVals.length * 0.98))) : 1;
  const pal = mMeta.inv ? YLGNBU.slice().reverse() : YLGNBU;
  const getColor = v => {
    if (vmax <= vmin) return pal.at(0);
    const idx = Math.max(0, Math.min(pal.length - 1, Math.floor(((v - vmin) / (vmax - vmin)) * pal.length)));
    return pal.at(idx);
  };

  const fo = document.getElementById("selFO").value, reg = document.getElementById("selReg").value;
  const terrTitle = reg !== "ALL" ? reg : (fo !== "RF" ? fo + " федеральный округ" : "Российская Федерация");
  el("text", {x: 560, y: 42, "text-anchor": "end", "font-size": 20, "font-weight": "bold"}, svg).textContent = terrTitle + ":";
  el("text", {x: 575, y: 42, "text-anchor": "start", "font-size": 20, "font-weight": "bold"}, svg).textContent = mMeta.title + " (" + (mode==="grid"?"2019–2024 гг.":yr+" г.") + ")";

  const tip = document.getElementById("tip");
  const bnd = getBounds(feats);
  const bw = Math.max(bnd.x1 - bnd.x0, 1), bh = Math.max(bnd.y1 - bnd.y0, 1);

  const drawMapBlock = (box, yKey, isPointMode) => {
    const sc = Math.min(box.w / bw, box.h / bh);
    const ox = box.x + (box.w - bw * sc) / 2, oy = box.y + (box.h - bh * sc) / 2;
    const mapX = x => ox + (x - bnd.x0) * sc;
    const mapY = y => oy + (bnd.y1 - y) * sc;
    const vYr = isPointMode ? ((DATA.panel[mId] && DATA.panel[mId][yKey]) || {}) : valMap;
    const g = el("g", {}, svg);

    feats.forEach(f => {
      let fill = "#f0f0f0";
      if (isPointMode) fill = "#f4f4f4";
      else if (f.properties.st === "В_выборке" && (base === "all" || f.properties.coh)) {
        const v = vYr[f.properties.id];
        if (v !== undefined && v !== null) fill = mMeta.cat ? (DATA.cluster_colors[v] || "#f0f0f0") : getColor(Number(v));
      }
      const p = el("path", {d: geomToPath(f.geometry, mapX, mapY), fill: fill, stroke: "#7a828e", "stroke-width": isPointMode ? 0.35 : 0.6}, g);
      p.onmousemove = ev => {
        const v = vYr[f.properties.id];
        const vTxt = mMeta.cat ? (v || "Вне выборки") : fmtNum(v, mMeta.dec);
        tip.style.display = "block"; tip.style.left = (ev.clientX+12)+"px"; tip.style.top = (ev.clientY+12)+"px";
        tip.innerHTML = "<b>" + f.properties.name + "</b><br>" + f.properties.reg + "<br>Значение: <b>" + vTxt + "</b>";
      };
      p.onmouseout = () => tip.style.display = "none";
    });

    if (isPointMode) {
      feats.forEach(f => {
        const v = vYr[f.properties.id];
        if (f.properties.st === "В_выборке" && f.properties.coh && v !== undefined) {
          const cPt = geomCentroid(f.geometry);
          el("circle", {cx: mapX(cPt.at(0)).toFixed(1), cy: mapY(cPt.at(1)).toFixed(1), r: fo === "RF" ? 3.5 : 5.5, fill: getColor(Number(v)), stroke: "#222", "stroke-width": 0.7}, g);
        }
      });
      el("text", {x: box.x + box.w/2, y: box.y - 6, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, g).textContent = yKey + " г.";
    }
  };

  if (mode === "single") {
    drawMapBlock({x: 50, y: 85, w: 1550, h: 895}, yr, false);
  } else {
    Array.of("2019","2020","2021","2022","2023","2024").forEach((yKey, idx) => {
      const col = idx % 3, row = Math.floor(idx / 3);
      drawMapBlock({x: 50 + col*525, y: 110 + row*445, w: 500, h: 400}, yKey, true);
    });
  }

  if (mMeta.cat) {
    Object.entries(DATA.cluster_colors).forEach((pair, idx) => {
      const lbl = pair.at(0), col = pair.at(1);
      const colI = idx % 4, rowI = Math.floor(idx / 4);
      const lx = 55 + colI * 395, ly = 1020 + rowI * 32;
      el("rect", {x: lx, y: ly, width: 18, height: 18, fill: col, stroke: "#666"}, svg);
      el("text", {x: lx + 26, y: ly + 14, "font-size": 13}, svg).textContent = lbl;
    });
  } else {
    const barX = 910, barY = 1020, barW = 690, barH = 18, stepW = barW / pal.length;
    pal.forEach((c, i) => el("rect", {x: barX + i*stepW, y: barY, width: stepW, height: barH, fill: c, stroke: "#666", "stroke-width": 0.4}, svg));
    Array.of(0.1, 0.3, 0.5, 0.7, 0.9).forEach(u => {
      const valTick = vmin + u * (vmax - vmin);
      el("text", {x: barX + u*barW, y: barY + 33, "text-anchor": "middle", "font-size": 12}, svg).textContent = fmtNum(valTick, mMeta.dec);
    });
    el("text", {x: barX + barW/2, y: barY + 56, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, svg).textContent = mMeta.title;
  }
}

function downloadPng() {
  const svgEl = document.getElementById("atlas");
  if (!svgEl) return alert("Для скачивания PNG переключитесь в режим карты или сетки.");
  const xml = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 3300; canvas.height = 2240;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const a = document.createElement("a");
    a.download = "Карта_" + document.getElementById("selMetric").value + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
}
</script>
</body>
</html>
